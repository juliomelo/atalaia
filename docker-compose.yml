services:
    movements:
        build:
            target: final
        image: brjuliomelo/atalaia-streaming
        cap_add:
            - SYS_PTRACE
        security_opt:
            - seccomp:unconfined
        command: movements amqp://rabbitmq -e ATALAIA_URLS 
        volumes:
            - /tmp/.X11-unix:/tmp/.X11-unix
            - recording:/data/local
        environment:
            DISPLAY: :0
        restart: unless-stopped
        depends_on:
            rabbitmq:
                condition: service_healthy
                restart: true
        env_file:
            - ./video_urls.env
        deploy:
            restart_policy:
                condition: any
                delay: 5s
                window: 120s
            # resources:
            #     reservation:
            #         devices:
            #             - capabilities: ["gpu", "tpu"]
        # networks:
        #     - atalaia-services

    objects:
        build:
            target: final
        image: brjuliomelo/atalaia-streaming
        cap_add:
            - SYS_PTRACE
        security_opt:
            - seccomp:unconfined
        command: objects amqp://rabbitmq 
        volumes:
            - /tmp/.X11-unix:/tmp/.X11-unix
            - recording:/data/local
        environment:
            DISPLAY: :0
        restart: unless-stopped
        depends_on:
            rabbitmq:
                condition: service_healthy
                restart: true
        # deploy:
        #     resources:
        #         reservations:
        #             devices:
        #                 - capabilities: ["gpu", "tpu"]
        # networks:
        #     - atalaia-services
            
    rabbitmq:
        image: rabbitmq:3.8.3-alpine
        # networks:
        #     - atalaia-services
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "rabbitmqctl", "eval", "{ true, rabbit_app_booted_and_running } = { rabbit:is_booted(node()), rabbit_app_booted_and_running }, { [], no_alarms } = { rabbit:alarms(), no_alarms }, [] /= rabbit_networking:active_listeners(), rabbitmq_node_is_healthy."]
            interval: 15s
            timeout: 30s
            retries: 5
            start_period: 5s

    telegram-person:
        image: brjuliomelo/telegram-reporter
        build:
            context: telegram-reporter
        volumes:
            - ./data:/data/local
        restart: unless-stopped
        depends_on:
            rabbitmq:
                condition: service_healthy
                restart: true
        env_file:
            - ./video_urls.env
        # networks:
        #     - atalaia-services

    telegram-manual:
        image: brjuliomelo/telegram-reporter
        build:
            context: telegram-reporter
        volumes:
            - ./data:/data/local
        restart: unless-stopped
        depends_on:
            rabbitmq:
                condition: service_healthy
                restart: true
        env_file:
            - ./video_urls.env
        environment:
            ROUTE: manual

    dahua:
        build:
            target: dahua-monitor
        image: brjuliomelo/atalaia-dahua-monitor
        volumes:
            - ./dahua-monitor:/home/node/app
            - /tmp/.X11-unix:/tmp/.X11-unix
            - ./data:/data/local
        command: ["/home/node/app"]
        env_file:
            - ./video_urls.env
        environment:
            DISPLAY: :0
            PERSON_NOTIFY: movement
            MQTT_URL: mqtt://mosquitto:1883
        depends_on:
            rabbitmq:
                condition: service_healthy
                restart: true
        cap_add:
            - SYS_PTRACE
        security_opt:
            - seccomp:unconfined
        restart: unless-stopped

